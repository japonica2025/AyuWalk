name: AyuWalkApp
options:
  bundleIdPrefix: local.ayuwalk
  deploymentTarget:
    iOS: "17.0"
packages:
  AyuWalkCore:
    path: AyuWalkCore
targets:
  AyuWalkApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AyuWalkApp
    dependencies:
      - package: AyuWalkCore
        product: AyuWalkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ayuwalk.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ayu Walk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
