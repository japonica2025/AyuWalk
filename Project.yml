name: AyuWalkApp
options:
  bundleIdPrefix: local.ayuwalk
  deploymentTarget:
    iOS: "17.0"
packages:
  AyuWalkCore:
    path: AyuWalkCore
targets:
  AyuWalkApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Secrets.xcconfig
    sources:
      - path: AyuWalkApp
    dependencies:
      - package: AyuWalkCore
        product: AyuWalkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ayuwalk.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AyuWalkApp/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
